name: android-apk

on:
  workflow_dispatch:
  push:
    # The shell is developed on this branch, so every push validates the CI.
    # `workflow_dispatch` alone is not enough: GitHub only registers it when the
    # workflow file exists on the default branch.
    branches: [feat/android-webview]
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # --- Web (WASM) ---
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,wasm-bindgen-cli

      - name: Build web
        working-directory: apps/wordcraft-web
        run: trunk build --release --public-url ./

      # --- Copy dist to shell ---
      # apps/wordcraft-web/Trunk.toml sets dist = "../../dist/web", so with
      # working-directory apps/wordcraft-web the build lands in <repo>/dist/web.
      - name: Copy web build to shell
        run: |
          test -d dist/web || { echo "dist/web missing — trunk output path changed?"; ls -la dist || true; exit 1; }
          mkdir -p android-shell/www
          cp -r dist/web/. android-shell/www/

      # --- Android shell ---
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # No package-lock.json is committed, so `npm ci` would fail; use `npm install`.
      - name: Install shell deps
        working-directory: android-shell
        run: npm install

      # android-shell/android/ is not committed (hand-written skeleton removed);
      # let Capacitor generate the real Android project (capacitor.settings.gradle,
      # :capacitor-android, assets dir, gradle wrapper). `cap add` also copies
      # www/ into android/app/src/main/assets/public.
      - name: Add Capacitor Android project
        working-directory: android-shell
        run: npx cap add android

      - name: Copy DeX-ready AndroidManifest
        run: cp android-shell/android-manifest.xml android-shell/android/app/src/main/AndroidManifest.xml

      - name: Copy custom MainActivity
        run: cp android-shell/android-main-activity.kt android-shell/android/app/src/main/java/com/wordcraft/app/MainActivity.kt

      - name: Copy FileBridge plugin
        run: cp android-shell/android-file-bridge.kt android-shell/android/app/src/main/java/com/wordcraft/app/FileBridge.kt

      - name: Copy FileBridgeCore plugin
        run: cp android-shell/android-file-core.kt android-shell/android/app/src/main/java/com/wordcraft/app/FileBridgeCore.kt

      - name: Copy the file bridge unit tests
        run: |
          mkdir -p android-shell/android/app/src/test/java/com/wordcraft/app
          cp android-shell/android-file-core-test.kt android-shell/android/app/src/test/java/com/wordcraft/app/FileBridgeTest.kt

      - name: Copy FileProvider paths
        run: |
          mkdir -p android-shell/android/app/src/main/res/xml
          cp android-shell/android-file-paths.xml android-shell/android/app/src/main/res/xml/file_paths.xml

      - name: Sync Capacitor Android
        working-directory: android-shell
        run: npx cap sync android

      - name: Run the file bridge unit tests
        working-directory: android-shell/android
        run: ./gradlew testDebugUnitTest

      - name: Build APK (debug)
        working-directory: android-shell/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: wordcraft-debug-apk
          if-no-files-found: error
          path: android-shell/android/app/build/outputs/apk/debug/*.apk
