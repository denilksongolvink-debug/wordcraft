name: android-apk

on:
  workflow_dispatch:
  push:
    # The shell is developed on this branch, so every push validates the CI.
    # `workflow_dispatch` alone is not enough: GitHub only registers it when the
    # workflow file exists on the default branch.
    branches: [feat/android-webview]
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # --- Web (WASM) ---
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,wasm-bindgen-cli

      - name: Build web
        working-directory: apps/wordcraft-web
        run: trunk build --release --public-url ./

      # --- Copy dist to shell ---
      # apps/wordcraft-web/Trunk.toml sets dist = "../../dist/web", so with
      # working-directory apps/wordcraft-web the build lands in <repo>/dist/web.
      - name: Copy web build to shell
        run: |
          test -d dist/web || { echo "dist/web missing — trunk output path changed?"; ls -la dist || true; exit 1; }
          mkdir -p android-shell/www
          cp -r dist/web/. android-shell/www/

      # --- Android shell ---
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # No package-lock.json is committed, so `npm ci` would fail; use `npm install`.
      - name: Install shell deps
        working-directory: android-shell
        run: npm install --include=dev

      # android-shell/android/ is not committed (hand-written skeleton removed);
      # let Capacitor generate the real Android project (capacitor.settings.gradle,
      # :capacitor-android, assets dir, gradle wrapper). `cap add` also copies
      # www/ into android/app/src/main/assets/public.
      - name: Add Capacitor Android project
        working-directory: android-shell
        run: npx cap add android

      - name: Enable Kotlin in generated Android project
        working-directory: android-shell
        run: |
          set -e
          ROOT_GRADLE="android/build.gradle"
          APP_GRADLE="android/app/build.gradle"
          KOTLIN_VERSION="1.9.22"

          # Add Kotlin Gradle plugin classpath to root buildscript if missing
          if grep -q "org.jetbrains.kotlin:kotlin-gradle-plugin" "$ROOT_GRADLE"; then
            echo "Kotlin plugin already present in $ROOT_GRADLE"
          else
            python3 - "$ROOT_GRADLE" "$KOTLIN_VERSION" << 'PY'
import sys

path = sys.argv[1]
version = sys.argv[2]
with open(path, 'r', encoding='utf-8') as f:
    content = f.read()

needle = "        classpath 'com.google.gms:google-services:4.4.0'\n\n        // NOTE: Do not place your application dependencies here; they belong"
replacement = "        classpath 'com.google.gms:google-services:4.4.0'\n        classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:" + version + "\"\n\n        // NOTE: Do not place your application dependencies here; they belong"
if needle not in content:
    # Fallback: try to insert before NOTE
    needle2 = "        // NOTE: Do not place your application dependencies here"
    if needle2 in content and "kotlin-gradle-plugin" not in content:
        replacement2 = "        classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:" + version + "\"\n\n        " + needle2
        content = content.replace(needle2, replacement2)
    else:
        sys.exit(0)
else:
    content = content.replace(needle, replacement)

with open(path, 'w', encoding='utf-8') as f:
    f.write(content)
PY
            echo "Added Kotlin plugin classpath to $ROOT_GRADLE"
          fi

          # Add kotlin-android plugin and stdlib to app build.gradle if missing
          if grep -q "apply plugin: 'kotlin-android'" "$APP_GRADLE"; then
            echo "kotlin-android already applied in $APP_GRADLE"
          else
            python3 - "$APP_GRADLE" "$KOTLIN_VERSION" << 'PY'
import sys

path = sys.argv[1]
version = sys.argv[2]
with open(path, 'r', encoding='utf-8') as f:
    content = f.read()

# Add plugin after com.android.application
old = "apply plugin: 'com.android.application'\n"
new = "apply plugin: 'com.android.application'\napply plugin: 'kotlin-android'\n"
if old in content and "kotlin-android" not in content:
    content = content.replace(old, new)

# Add stdlib dependency if missing
if "org.jetbrains.kotlin:kotlin-stdlib" not in content:
    # Try to add before testImplementation or at end of dependencies
    if "    testImplementation" in content:
        content = content.replace("    testImplementation", "    implementation \"org.jetbrains.kotlin:kotlin-stdlib:" + version + "\"\n    testImplementation", 1)
    elif "dependencies {" in content:
        # append before last }
        # naive: insert before final }
        idx = content.rfind('}')
        if idx >= 0:
            content = content[:idx] + "    implementation \"org.jetbrains.kotlin:kotlin-stdlib:" + version + "\"\n}\n" + content[idx+1:]
with open(path, 'w', encoding='utf-8') as f:
    f.write(content)
PY
            echo "Added kotlin-android and stdlib to $APP_GRADLE"
          fi

          grep -n "kotlin" "$ROOT_GRADLE" "$APP_GRADLE" | head -15

      - name: Copy DeX-ready AndroidManifest
        run: cp android-shell/android-manifest.xml android-shell/android/app/src/main/AndroidManifest.xml

      - name: Copy custom MainActivity
        run: cp android-shell/android-main-activity.kt android-shell/android/app/src/main/java/com/wordcraft/app/MainActivity.kt

      - name: Copy FileBridge plugin
        run: cp android-shell/android-file-bridge.kt android-shell/android/app/src/main/java/com/wordcraft/app/FileBridge.kt

      - name: Copy FileBridgeCore plugin
        run: cp android-shell/android-file-core.kt android-shell/android/app/src/main/java/com/wordcraft/app/FileBridgeCore.kt

      - name: Copy the file bridge unit tests
        run: |
          mkdir -p android-shell/android/app/src/test/java/com/wordcraft/app
          cp android-shell/android-file-core-test.kt android-shell/android/app/src/test/java/com/wordcraft/app/FileBridgeTest.kt

      - name: Copy FileProvider paths
        run: |
          mkdir -p android-shell/android/app/src/main/res/xml
          cp android-shell/android-file-paths.xml android-shell/android/app/src/main/res/xml/file_paths.xml

      - name: Sync Capacitor Android
        working-directory: android-shell
        run: npx cap sync android

      - name: Run the file bridge unit tests
        working-directory: android-shell/android
        run: ./gradlew testDebugUnitTest

      - name: Build APK (debug)
        working-directory: android-shell/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: wordcraft-debug-apk
          if-no-files-found: error
          path: android-shell/android/app/build/outputs/apk/debug/*.apk
