buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.2.0"
    }
}

apply plugin: "com.android.application"

android {
    namespace "com.wordcraft.app"
    compileSdk 34
    defaultConfig {
        applicationId "com.wordcraft.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.8.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
}
